# Alembic configuration for the agent-scaffold backend.
#
# ASCII ONLY. This file is read by configparser with encoding="locale", which on
# a Chinese Windows is GBK -- so a single em-dash in a comment makes every
# alembic command die with "UnicodeDecodeError: 'gbk' codec". Found the hard way;
# keep this file to plain ASCII.
#
# Deliberately minimal. Two things a stock `alembic init` puts here are absent
# on purpose:
#
#   * `sqlalchemy.url` -- the database location is a *runtime* decision
#     (`DATABASE_URL`, or `DATA_DIR/scaffold.db`), and it differs between the
#     app, the tests, and a production deployment. Hard-coding it here would
#     create a second source of truth that silently wins when someone runs
#     `alembic upgrade` by hand against the wrong file. `migrations/env.py` reads
#     it from the application settings instead.
#
#   * logging configuration -- the app already configures logging, and a second
#     `[logger_*]` block here would take effect only under alembic, making the
#     same code log differently depending on how it was invoked.
#
# Usage (from `backend/`):
#
#   alembic upgrade head                      # apply migrations
#   alembic upgrade head --sql                # print the SQL instead of running it
#   alembic revision --autogenerate -m "..."  # after changing app/db/models.py
#   alembic current / alembic history         # where am I / what exists

[alembic]
script_location = migrations
prepend_sys_path = .

# How to split `prepend_sys_path`. Without it alembic falls back to splitting on
# spaces, commas and colons and warns (DeprecationWarning at import time). `os`
# means "use this platform's path separator", which is what a single `.` wants.
path_separator = os

# Timestamped revision filenames sort as they were created, which makes
# `ls versions/` a readable history without opening anything.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# `alembic revision --autogenerate` needs the model metadata, which needs the
# application importable. `prepend_sys_path` above covers that; this flag makes
# autogenerate also notice column *type* changes, which the drift test in
# `tests/test_migrations.py` depends on.
compare_type = true

[post_write_hooks]
