<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" role="img" aria-label="Agent Scaffold Hero Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d1a"/>
      <stop offset="55%" stop-color="#0b1528"/>
      <stop offset="100%" stop-color="#081120"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="76%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#18d8f0" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#2563eb" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#070d1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="22%" cy="82%" r="38%">
      <stop offset="0%" stop-color="#f5a623" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#070d1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18d8f0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#18d8f0" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#18d8f0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lineCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18d8f0"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1b2d4a" stroke-width="0.7" opacity="0.55"/>
      <circle cx="0" cy="0" r="1" fill="#2b4b7a" opacity="0.7"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="cardClip">
      <rect x="2" y="2" width="1196" height="376" rx="18"/>
    </clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; }
      .sans { font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .dashFlow { stroke-dasharray: 7 7; animation: flow 2.4s linear infinite; }
      .dashSlow { stroke-dasharray: 4 8; animation: flow 6s linear infinite reverse; }
      .scanline { animation: scan 5.5s ease-in-out infinite; }
      .pulseBeacon { animation: beacon 2s ease-in-out infinite; transform-origin: center; }
      .nodePulse1 { animation: npulse 3.6s ease-in-out infinite; }
      .nodePulse2 { animation: npulse 3.6s ease-in-out 0.9s infinite; }
      .nodePulse3 { animation: npulse 3.6s ease-in-out 1.8s infinite; }
      .nodePulse4 { animation: npulse 3.6s ease-in-out 2.7s infinite; }
      @keyframes flow { to { stroke-dashoffset: -56; } }
      @keyframes scan { 0%, 100% { transform: translateY(-60px); opacity: 0.25; } 50% { transform: translateY(340px); opacity: 0.7; } }
      @keyframes beacon { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @keyframes npulse { 0%, 100% { stroke-opacity: 0.45; } 50% { stroke-opacity: 1; } }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="1200" height="380" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="1200" height="380" fill="url(#grid)"/>
    <rect x="0" y="0" width="1200" height="380" fill="url(#cyanGlow)"/>
    <rect x="0" y="0" width="1200" height="380" fill="url(#amberGlow)"/>

    <!-- Moving scan beam -->
    <rect class="scanline" x="0" y="0" width="1200" height="58" fill="url(#scanGrad)"/>

    <!-- Corner HUD brackets -->
    <path d="M 24 44 L 24 24 L 54 24" fill="none" stroke="#18d8f0" stroke-width="2" opacity="0.75"/>
    <path d="M 1146 24 L 1176 24 L 1176 44" fill="none" stroke="#18d8f0" stroke-width="2" opacity="0.75"/>
    <path d="M 24 336 L 24 356 L 54 356" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.55"/>
    <path d="M 1146 356 L 1176 356 L 1176 336" fill="none" stroke="#f5a623" stroke-width="2" opacity="0.75"/>

    <!-- Top Telemetry Bar -->
    <g transform="translate(56, 46)">
      <rect x="0" y="0" width="445" height="28" rx="6" fill="#0f1d35" stroke="#1f3b64" stroke-width="1"/>
      <circle class="pulseBeacon" cx="16" cy="14" r="4" fill="#18d8f0" filter="url(#glow)"/>
      <circle cx="16" cy="14" r="8" fill="none" stroke="#18d8f0" stroke-width="1" opacity="0.5">
        <animate attributeName="r" values="4;11;4" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0;0.7" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="30" y="18" fill="#89dceb" font-size="11.5" font-weight="700" class="mono" letter-spacing="0.8">SYS://LANGGRAPH-COMPILER · 21 NODES · SHA-256 SEALED</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(56, 128)">
      <text x="0" y="0" fill="#f1f7ff" font-size="54" font-weight="800" class="sans" letter-spacing="-1">AGENT SCAFFOLD</text>
      <!-- Animated glowing trace underline -->
      <path d="M 0 18 L 280 18 L 294 26 L 470 26" fill="none" stroke="url(#lineCyan)" stroke-width="2.5" filter="url(#glow)"/>
      <circle r="3.5" fill="#fff7cc" filter="url(#glow)">
        <animateMotion dur="3.2s" repeatCount="indefinite" path="M 0 18 L 280 18 L 294 26 L 470 26"/>
      </circle>

      <text x="0" y="58" fill="#b7cae4" font-size="19" font-weight="600" class="sans">在画布上设计 AI Agent 工作流，编译为 LangGraph 可执行图</text>
      <text x="0" y="88" fill="#8ea6c7" font-size="15" class="sans">并发 · 预算熔断 · 故障隔离 · 长期记忆 · 定时/Webhook 调度 — 导出即独立运行仓库</text>
    </g>

    <!-- Live Metrics Chips -->
    <g transform="translate(56, 266)">
      <g>
        <rect x="0" y="0" width="128" height="58" rx="9" fill="#0d192e" stroke="#1f3b64" stroke-width="1"/>
        <text x="14" y="25" fill="#18d8f0" font-size="19" font-weight="800" class="mono">21 种</text>
        <text x="14" y="45" fill="#8ea6c7" font-size="11.5" class="sans">注册表驱动节点</text>
      </g>
      <g transform="translate(142, 0)">
        <rect x="0" y="0" width="136" height="58" rx="9" fill="#0d192e" stroke="#1f3b64" stroke-width="1"/>
        <text x="14" y="25" fill="#38bdf8" font-size="19" font-weight="800" class="mono">1,338+</text>
        <text x="14" y="45" fill="#8ea6c7" font-size="11.5" class="sans">后端单元测试通过</text>
      </g>
      <g transform="translate(292, 0)">
        <rect x="0" y="0" width="136" height="58" rx="9" fill="#0d192e" stroke="#1f3b64" stroke-width="1"/>
        <text x="14" y="25" fill="#f5a623" font-size="19" font-weight="800" class="mono">49 / 49</text>
        <text x="14" y="45" fill="#8ea6c7" font-size="11.5" class="sans">SHA-256 离线封条</text>
      </g>
      <g transform="translate(442, 0)">
        <rect x="0" y="0" width="136" height="58" rx="9" fill="#0d192e" stroke="#1f3b64" stroke-width="1"/>
        <text x="14" y="25" fill="#ff5c7c" font-size="19" font-weight="800" class="mono">0 依赖</text>
        <text x="14" y="45" fill="#8ea6c7" font-size="11.5" class="sans">运行时脱离画布</text>
      </g>
    </g>

    <!-- Right Interactive-style Animated DAG Telemetry Radar -->
    <g transform="translate(650, 34)">
      <rect x="0" y="0" width="510" height="312" rx="14" fill="#091324" stroke="#1d3557" stroke-width="1.2"/>
      <line x1="0" y1="38" x2="510" y2="38" stroke="#182d4c" stroke-width="1"/>
      <text x="18" y="24" fill="#86a5cc" font-size="11" font-weight="700" class="mono">GRAPH://LIVE_COMPILATION_DAG</text>
      <text x="410" y="24" fill="#18d8f0" font-size="11" font-weight="700" class="mono">SSE: STREAM</text>
      <circle cx="398" cy="20" r="3.5" fill="#18d8f0">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
      </circle>

      <!-- Radar rings behind Export -->
      <g transform="translate(425, 175)">
        <circle r="76" fill="none" stroke="#18d8f0" stroke-width="0.8" opacity="0.2" class="dashSlow"/>
        <circle r="54" fill="none" stroke="#f5a623" stroke-width="0.9" opacity="0.26" stroke-dasharray="3 6">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- DAG Curved Edges -->
      <path id="e1" d="M 106 112 C 145 112, 145 92, 184 92" fill="none" stroke="#224c7a" stroke-width="2"/>
      <path d="M 106 112 C 145 112, 145 92, 184 92" fill="none" stroke="#18d8f0" stroke-width="1.5" class="dashFlow" opacity="0.85"/>

      <path id="e2" d="M 106 122 C 145 122, 145 215, 184 215" fill="none" stroke="#224c7a" stroke-width="2"/>
      <path d="M 106 122 C 145 122, 145 215, 184 215" fill="none" stroke="#38bdf8" stroke-width="1.5" class="dashFlow" opacity="0.8"/>

      <path id="e3" d="M 288 92 C 330 92, 330 164, 372 164" fill="none" stroke="#224c7a" stroke-width="2"/>
      <path d="M 288 92 C 330 92, 330 164, 372 164" fill="none" stroke="#18d8f0" stroke-width="1.5" class="dashFlow" opacity="0.85"/>

      <path id="e4" d="M 288 215 C 330 215, 330 182, 372 182" fill="none" stroke="#224c7a" stroke-width="2"/>
      <path d="M 288 215 C 330 215, 330 182, 372 182" fill="none" stroke="#f5a623" stroke-width="1.5" class="dashFlow" opacity="0.85"/>

      <!-- Traveling Signal Photons -->
      <circle r="4" fill="#18d8f0" filter="url(#glow)">
        <animateMotion dur="1.9s" repeatCount="indefinite" path="M 106 112 C 145 112, 145 92, 184 92"/>
      </circle>
      <circle r="3.5" fill="#38bdf8" filter="url(#glow)">
        <animateMotion dur="2.3s" begin="0.4s" repeatCount="indefinite" path="M 106 122 C 145 122, 145 215, 184 215"/>
      </circle>
      <circle r="4" fill="#18d8f0" filter="url(#glow)">
        <animateMotion dur="1.8s" begin="0.9s" repeatCount="indefinite" path="M 288 92 C 330 92, 330 164, 372 164"/>
      </circle>
      <circle r="4" fill="#f5a623" filter="url(#glow)">
        <animateMotion dur="2.1s" begin="1.2s" repeatCount="indefinite" path="M 288 215 C 330 215, 330 182, 372 182"/>
      </circle>

      <!-- Nodes -->
      <!-- Node 1: Start -->
      <g transform="translate(22, 86)">
        <rect class="nodePulse1" x="0" y="0" width="84" height="58" rx="8" fill="#102038" stroke="#18d8f0" stroke-width="1.4"/>
        <rect x="0" y="0" width="84" height="4" rx="2" fill="#18d8f0"/>
        <text x="12" y="25" fill="#eef5ff" font-size="11" font-weight="700" class="sans">START</text>
        <text x="12" y="43" fill="#89dceb" font-size="9.5" class="mono">input_schema</text>
      </g>

      <!-- Node 2: LLM / Copilot -->
      <g transform="translate(184, 62)">
        <rect class="nodePulse2" x="0" y="0" width="104" height="60" rx="8" fill="#102038" stroke="#38bdf8" stroke-width="1.4"/>
        <rect x="0" y="0" width="104" height="4" rx="2" fill="#38bdf8"/>
        <text x="12" y="25" fill="#eef5ff" font-size="11" font-weight="700" class="sans">LLM / AGENT</text>
        <text x="12" y="43" fill="#9bc5f2" font-size="9.5" class="mono">stream + retry</text>
      </g>

      <!-- Node 3: Guard / Packs -->
      <g transform="translate(184, 185)">
        <rect class="nodePulse3" x="0" y="0" width="104" height="60" rx="8" fill="#102038" stroke="#f5a623" stroke-width="1.4"/>
        <rect x="0" y="0" width="104" height="4" rx="2" fill="#f5a623"/>
        <text x="12" y="25" fill="#eef5ff" font-size="11" font-weight="700" class="sans">TOOL / PACKS</text>
        <text x="12" y="43" fill="#f8c978" font-size="9.5" class="mono">sandbox + audit</text>
      </g>

      <!-- Node 4: Export Seal -->
      <g transform="translate(372, 138)">
        <rect class="nodePulse4" x="0" y="0" width="114" height="70" rx="10" fill="#12253f" stroke="#18d8f0" stroke-width="1.6"/>
        <rect x="0" y="0" width="114" height="4" rx="2" fill="#ff5c7c"/>
        <text x="12" y="27" fill="#eef5ff" font-size="11.5" font-weight="700" class="sans">EXPORT REPO</text>
        <text x="12" y="44" fill="#18d8f0" font-size="9.5" class="mono">agent.lock</text>
        <text x="12" y="59" fill="#ff8fa3" font-size="9" class="mono">sha256:verified</text>
      </g>

      <!-- Live Telemetry Footer inside SVG box -->
      <rect x="18" y="266" width="474" height="32" rx="6" fill="#07101f" stroke="#1a3154" stroke-width="1"/>
      <text x="30" y="286" fill="#18d8f0" font-size="10.5" class="mono">▸ node_finished[llm_1]  tokens=1,420  budget=OK  fault_policy=default  seal=PASS</text>
    </g>
  </g>
  <!-- Outer frame -->
  <rect x="1" y="1" width="1198" height="378" rx="18" fill="none" stroke="#1f3b64" stroke-width="1.5"/>
</svg>
