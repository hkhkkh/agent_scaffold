<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 350" width="100%" role="img" aria-label="Agent Scaffold 三层构建与运行时独立架构流向图">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08101e"/>
      <stop offset="100%" stop-color="#0d182d"/>
    </linearGradient>
    <pattern id="archGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#182a46" stroke-width="0.65" opacity="0.6"/>
    </pattern>
    <filter id="archGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; }
      .sans { font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .flowCyan { stroke-dasharray: 8 6; animation: dash 2.2s linear infinite; }
      .flowAmber { stroke-dasharray: 6 6; animation: dash 2.6s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -48; } }
    </style>
  </defs>

  <rect x="1" y="1" width="1118" height="348" rx="16" fill="url(#archBg)" stroke="#1e365c" stroke-width="1.5"/>
  <rect x="2" y="2" width="1116" height="346" rx="15" fill="url(#archGrid)"/>

  <!-- Header -->
  <text x="28" y="34" fill="#18d8f0" font-size="11.5" font-weight="700" class="mono">ARCHITECTURE // BUILD-TIME MOLD vs STANDALONE RUNTIME</text>
  <text x="802" y="34" fill="#8ea6c7" font-size="11.5" class="mono">AST 边界校验: ZERO CANVAS IMPORTS</text>

  <!-- Layer 1: Canvas Studio -->
  <g transform="translate(28, 60)">
    <rect x="0" y="0" width="300" height="254" rx="12" fill="#0f1d35" stroke="#38bdf8" stroke-width="1.4"/>
    <rect x="0" y="0" width="300" height="34" rx="12" fill="#142848"/>
    <text x="16" y="22" fill="#38bdf8" font-size="12" font-weight="800" class="mono">LAYER 1 · 画布平台（构建期）</text>
    <text x="16" y="60" fill="#eef5ff" font-size="15" font-weight="700" class="sans">模具与试模机 — 仅设计阶段使用</text>
    <rect x="16" y="76" width="268" height="44" rx="7" fill="#091324" stroke="#223e68"/>
    <text x="28" y="96" fill="#d9e7fa" font-size="12" font-weight="700" class="sans">React 19 + React Flow 画布</text>
    <text x="28" y="112" fill="#8ea6c7" font-size="10.5" class="mono">Schema驱动表单 · 版本Diff · 使用视图</text>

    <rect x="16" y="130" width="268" height="44" rx="7" fill="#091324" stroke="#223e68"/>
    <text x="28" y="150" fill="#d9e7fa" font-size="12" font-weight="700" class="sans">AI Copilot（受控副驾）</text>
    <text x="28" y="166" fill="#8ea6c7" font-size="10.5" class="mono">生图 / 最小修复 / 三重防删光护栏</text>

    <rect x="16" y="184" width="268" height="52" rx="7" fill="#091324" stroke="#223e68"/>
    <text x="28" y="205" fill="#d9e7fa" font-size="12" font-weight="700" class="sans">FastAPI + SQLModel + Alembic</text>
    <text x="28" y="222" fill="#8ea6c7" font-size="10.5" class="mono">本地调试运行 · 试跑 SSE 观测</text>
  </g>

  <!-- Export Bridge (Layer 1 -> Layer 3) -->
  <path d="M 328 145 L 434 145" fill="none" stroke="#1e3c66" stroke-width="3"/>
  <path d="M 328 145 L 434 145" fill="none" stroke="#18d8f0" stroke-width="2" class="flowCyan"/>
  <circle r="4.5" fill="#18d8f0" filter="url(#archGlow)">
    <animateMotion dur="1.7s" repeatCount="indefinite" path="M 328 145 L 434 145"/>
  </circle>

  <!-- Seal Gate -->
  <g transform="translate(342, 84)">
    <rect x="0" y="0" width="80" height="44" rx="7" fill="#12243f" stroke="#f5a623" stroke-width="1.2"/>
    <text x="11" y="18" fill="#f5a623" font-size="10" font-weight="800" class="mono">EXPORT SEAL</text>
    <text x="11" y="34" fill="#ffe2a8" font-size="9.5" class="mono">sha256:lock</text>
  </g>

  <!-- Zero reverse dependency barrier -->
  <path d="M 434 252 L 328 252" fill="none" stroke="#ff5c7c" stroke-width="1.6" stroke-dasharray="4 4" opacity="0.8"/>
  <rect x="336" y="264" width="90" height="26" rx="5" fill="#2a1220" stroke="#ff5c7c" stroke-width="1"/>
  <text x="345" y="281" fill="#ff9fb2" font-size="10" font-weight="700" class="sans">✕ 运行时零反连</text>

  <!-- Layer 3: Exported Standalone Agent -->
  <g transform="translate(434, 60)">
    <rect x="0" y="0" width="310" height="254" rx="12" fill="#0f1d35" stroke="#18d8f0" stroke-width="1.6"/>
    <rect x="0" y="0" width="310" height="34" rx="12" fill="#123149"/>
    <text x="16" y="22" fill="#18d8f0" font-size="12" font-weight="800" class="mono">LAYER 3 · 导出交付仓库（独立运行）</text>
    <text x="16" y="60" fill="#eef5ff" font-size="15" font-weight="700" class="sans">my-agent/ — 可独立 Git 交付与 Docker 部署</text>

    <rect x="16" y="76" width="130" height="68" rx="7" fill="#091324" stroke="#1d4466"/>
    <text x="26" y="96" fill="#18d8f0" font-size="11.5" font-weight="700" class="mono">agent.yaml</text>
    <text x="26" y="114" fill="#9bc5f2" font-size="10.5" class="mono">agent.lock</text>
    <text x="26" y="132" fill="#8ea6c7" font-size="10" class="mono">!ref prompts/ code/</text>

    <rect x="156" y="76" width="138" height="68" rx="7" fill="#091324" stroke="#1d4466"/>
    <text x="166" y="96" fill="#f5a623" font-size="11.5" font-weight="700" class="mono">requirements.txt</text>
    <text x="166" y="114" fill="#ffe2a8" font-size="10.5" class="mono">49/49 whl sha256</text>
    <text x="166" y="132" fill="#8ea6c7" font-size="10" class="mono">vendor/ 离线安装</text>

    <rect x="16" y="156" width="278" height="80" rx="7" fill="#091324" stroke="#1d4466"/>
    <text x="28" y="177" fill="#eef5ff" font-size="12" font-weight="700" class="mono">main.py CLI + Dockerfile</text>
    <text x="28" y="198" fill="#89dceb" font-size="11" class="mono">run · serve --http · daemon · selfcheck</text>
    <text x="28" y="218" fill="#8ea6c7" font-size="10.5" class="sans">自带对话界面、SSE 流式与 SQLite 会话存储</text>
  </g>

  <!-- Runtime Dependency Link (Layer 3 <-> Layer 2) -->
  <path d="M 744 150 L 814 150" fill="none" stroke="#1e3c66" stroke-width="3"/>
  <path d="M 744 150 L 814 150" fill="none" stroke="#f5a623" stroke-width="2" class="flowAmber"/>
  <circle r="4" fill="#f5a623" filter="url(#archGlow)">
    <animateMotion dur="1.4s" repeatCount="indefinite" path="M 744 150 L 814 150"/>
  </circle>

  <path d="M 814 218 L 744 218" fill="none" stroke="#1e3c66" stroke-width="3"/>
  <path d="M 814 218 L 744 218" fill="none" stroke="#18d8f0" stroke-width="2" class="flowCyan"/>
  <circle r="4" fill="#18d8f0" filter="url(#archGlow)">
    <animateMotion dur="1.4s" begin="0.7s" repeatCount="indefinite" path="M 814 218 L 744 218"/>
  </circle>

  <!-- Layer 2: Shared Runtime -->
  <g transform="translate(814, 60)">
    <rect x="0" y="0" width="278" height="254" rx="12" fill="#0f1d35" stroke="#f5a623" stroke-width="1.4"/>
    <rect x="0" y="0" width="278" height="34" rx="12" fill="#2b2416"/>
    <text x="16" y="22" fill="#f5a623" font-size="12" font-weight="800" class="mono">LAYER 2 · 共享 RUNTIME（同一份）</text>
    <text x="16" y="60" fill="#eef5ff" font-size="15" font-weight="700" class="sans">画布与导出包跑同一份引擎</text>

    <rect x="16" y="76" width="246" height="44" rx="7" fill="#091324" stroke="#47381f"/>
    <text x="28" y="96" fill="#ffe2a8" font-size="12" font-weight="700" class="sans">LangGraph 编译器与执行器</text>
    <text x="28" y="112" fill="#8ea6c7" font-size="10.5" class="mono">条件分支 · 有界循环 · 子图钉哈希</text>

    <rect x="16" y="130" width="246" height="44" rx="7" fill="#091324" stroke="#47381f"/>
    <text x="28" y="150" fill="#ffe2a8" font-size="12" font-weight="700" class="sans">横切策略与能力包（Packs）</text>
    <text x="28" y="166" fill="#8ea6c7" font-size="10.5" class="mono">并发队列 · 超时重试 · 熔断 · files包</text>

    <rect x="16" y="184" width="246" height="52" rx="7" fill="#091324" stroke="#47381f"/>
    <text x="28" y="205" fill="#ffe2a8" font-size="12" font-weight="700" class="sans">安全底座与记忆系统</text>
    <text x="28" y="222" fill="#8ea6c7" font-size="10.5" class="mono">沙盒隔离 · SSRF拦截 · 脱敏 · Memory</text>
  </g>
</svg>
